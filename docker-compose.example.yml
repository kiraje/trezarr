# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.example.yml — Trezarr example deployment (D-64, D-78)
#
#   cp docker-compose.example.yml docker-compose.yml   # then adjust for your host
#   cp .env.example .env                               # then add your LLM API key
#   docker compose up -d --build
#
# IMPORTANT — Media path alignment:
#   The media volume's CONTAINER path MUST match the path Sonarr/Radarr/Bazarr
#   see AND the path mappings recorded in /config/config.yaml. This template uses
#   /data/media (Trezarr's convention). If your *arr stack mounts the library at
#   a different path, use that same path on BOTH sides and update config.yaml —
#   a mismatch breaks source-subtitle lookup and sidecar writes.
#   See CLAUDE.md §Docker Packaging and §*arr Integration.
#
# SECURITY (D-78 single-user / trusted LAN):
#   Trezarr has no built-in authentication — it is designed for a private,
#   trusted local network alongside Sonarr/Radarr/Bazarr. To restrict access:
#     a) Bind to localhost only: change "6868:6868" to "127.0.0.1:6868:6868"
#        and front it with an authenticating reverse proxy (nginx/Caddy/Traefik).
#     b) Or keep Trezarr on an internal Docker network with no published ports.
#
# Secrets:
#   The LLM API key is NEVER written into this file — it is interpolated from a
#   gitignored `.env` (see `.env.example`). *arr API keys can live in
#   /config/config.yaml (written via the web UI, survives redeploys) or be
#   injected via the optional TREZARR_*_API_KEY env vars below.
# ─────────────────────────────────────────────────────────────────────────────

services:
  trezarr:
    # Build from source (tagging the result trezarr:local), or comment out
    # `build:` and pull a pre-built `image:` from your registry instead.
    build:
      context: .
    image: trezarr:local

    container_name: trezarr
    restart: unless-stopped

    ports:
      - "6868:6868"            # LAN. For proxy-only access use "127.0.0.1:6868:6868"

    volumes:
      # Config volume — SQLite Series Bible DB, config.yaml, quarantine, logs.
      - ${TREZARR_CONFIG_DIR:-./config}:/config
      # Media volume — CONTAINER path /data/media must match config.yaml mappings
      # and the path the *arr containers use. Add more mounts (movies, etc.) as needed.
      - ${TREZARR_MEDIA_DIR:-/path/to/media}:/data/media

    environment:
      # Privilege drop — set to the UID:GID that owns your media files so .vi.srt
      # sidecars are written with correct ownership. Run `id` to find these.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}

      # LLM endpoint. Key is REQUIRED and comes from .env (never committed).
      - TREZARR_LLM_API_KEY=${TREZARR_LLM_API_KEY:?Set TREZARR_LLM_API_KEY in .env (copy .env.example)}
      - TREZARR_LLM_BASE_URL=${TREZARR_LLM_BASE_URL:-https://api.openai.com/v1}
      - TREZARR_LLM_MODEL=${TREZARR_LLM_MODEL:-gpt-4o}

      - TREZARR_CONFIG_PATH=/config/config.yaml

      # Optional: inject *arr keys via env instead of storing them in config.yaml.
      # - TREZARR_SONARR_API_KEY=${TREZARR_SONARR_API_KEY:-}
      # - TREZARR_RADARR_API_KEY=${TREZARR_RADARR_API_KEY:-}
      # - TREZARR_BAZARR_API_KEY=${TREZARR_BAZARR_API_KEY:-}

    # Healthcheck (curl http://localhost:6868/api/health) is defined in the
    # Dockerfile and inherited automatically — no need to redeclare it here.

    # Start the *arr stack first if they share this compose project:
    # depends_on:
    #   sonarr: { condition: service_started }
    #   radarr: { condition: service_started }
    #   bazarr: { condition: service_started }

[project]
name = "trezarr"
version = "0.1.0"
description = "Automated Vietnamese subtitle translator for the Bazarr/*arr self-hosted media stack"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.38.0",
    "pydantic>=2.13.4",
    "pydantic-settings[yaml]>=2.14.1",
    "charset-normalizer>=3.4.7",
    "tenacity>=9.1.4",
    "pyarr>=6.6,<6.7",
    "sqlalchemy[asyncio]>=2.0.50,<2.1",
    "aiosqlite>=0.22.1,<0.23",
    "alembic>=1.18.4,<1.19",
]

[project.scripts]
trezarr = "trezarr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-httpx>=0.36,<0.37",
    "ruff>=0.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Required for `uv sync` to install console_scripts ([project.scripts]) defined
# above. Without this flag, uv treats the workspace as un-packaged and the
# entry-point is skipped (which would mean `uv run trezarr` would not be
# wired). The Phase-3 vertical slice ships a single `trezarr` CLI command.
[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trezarr"]
